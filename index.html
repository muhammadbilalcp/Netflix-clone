// Minimal lucide-style icon set, hand-rolled as inline SVG React components.
// Avoids depending on an external icon CDN for the static deploy.
const { createElement: h } = React;

function Icon({ children, size = 20, className, style, ...rest }) {
  return h(
    "svg",
    {
      width: size,
      height: size,
      viewBox: "0 0 24 24",
      fill: "none",
      stroke: "currentColor",
      strokeWidth: 2,
      strokeLinecap: "round",
      strokeLinejoin: "round",
      className,
      style,
      ...rest,
    },
    children
  );
}

const Search = (props) =>
  h(Icon, props, h("circle", { cx: 11, cy: 11, r: 8 }), h("path", { d: "m21 21-4.3-4.3" }));

const Menu = (props) =>
  h(Icon, props, h("line", { x1: 4, y1: 6, x2: 20, y2: 6 }), h("line", { x1: 4, y1: 12, x2: 20, y2: 12 }), h("line", { x1: 4, y1: 18, x2: 20, y2: 18 }));

const X = (props) =>
  h(Icon, props, h("line", { x1: 18, y1: 6, x2: 6, y2: 18 }), h("line", { x1: 6, y1: 6, x2: 18, y2: 18 }));

const Play = (props) => h(Icon, { ...props, fill: props.fill || "none" }, h("polygon", { points: "6 3 20 12 6 21 6 3" }));

const Info = (props) =>
  h(Icon, props, h("circle", { cx: 12, cy: 12, r: 10 }), h("line", { x1: 12, y1: 16, x2: 12, y2: 12 }), h("line", { x1: 12, y1: 8, x2: 12.01, y2: 8 }));

const Plus = (props) => h(Icon, props, h("line", { x1: 12, y1: 5, x2: 12, y2: 19 }), h("line", { x1: 5, y1: 12, x2: 19, y2: 12 }));

const Check = (props) => h(Icon, props, h("polyline", { points: "20 6 9 17 4 12" }));

const Star = (props) =>
  h(
    Icon,
    { ...props, fill: props.fill || "none" },
    h("polygon", {
      points:
        "12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2",

const ArrowLeft = (props) =>

const ChevronLeft = (props) => h(Icon, props, h("polyline", { points: "15 18 9 12 15 6" }));

const ChevronRight = (props) => h(Icon, props, h("polyline", { points: "9 18 15 12 9 6" }));

const PlayCircle = (props) =>
  h(Icon, props, h("circle", { cx: 12, cy: 12, r: 10 }), h("polygon", { points: "10 8 16 12 10 16 10 8" }));

const Bookmark = (props) =>
  h(Icon, props, h("path", { d: "M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" }));

const Trash2 = (props) =>
  h(
    Icon,
    props,
    h("polyline", { points: "3 6 5 6 21 6" }),
    h("path", { d: "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" }),
    h("line", { x1: 10, y1: 11, x2: 10, y2: 17 }),
    h("line", { x1: 14, y1: 11, x2: 14, y2: 17 })
  );

const AlertTriangle = (props) =>
  h(
    Icon,
    props,
    h("path", { d: "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" }),
    h("line", { x1: 12, y1: 9, x2: 12, y2: 13 }),

const Key = (props) =>
  h(
    Icon,
    props,
    h("path", {
      d: "M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4",
    })
  );

const Clock = (props) =>
  h(Icon, props, h("circle", { cx: 12, cy: 12, r: 10 }), h("polyline", { points: "12 6 12 12 16 14" }));
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------------- TMDB client ---------------- */
const TMDB_BASE = "https://api.themoviedb.org/3";
const IMG = {
  poster: (p, size = "w342") => (p ? `https://image.tmdb.org/t/p/${size}${p}` : null),
  backdrop: (p, size = "w1280") => (p ? `https://image.tmdb.org/t/p/${size}${p}` : null),
};

function useTmdb(apiKey) {
  const fetcher = useCallback(
    async (endpoint, params = {}) => {
      if (!apiKey) throw new Error("NO_KEY");
      const url = new URL(`${TMDB_BASE}${endpoint}`);
      url.searchParams.set("api_key", apiKey);
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
      });
      const res = await fetch(url.toString());
      if (!res.ok) throw new Error(`TMDB ${res.status}`);
      return res.json();
    },
    [apiKey]
  );

  return useMemo(
    () => ({
      trending: (m = "all", w = "week") => fetcher(`/trending/${m}/${w}`),
      popularMovies: (p = 1) => fetcher("/movie/popular", { page: p }),
      topMovies: (p = 1) => fetcher("/movie/top_rated", { page: p }),
      popularTV: (p = 1) => fetcher("/tv/popular", { page: p }),
      topTV: (p = 1) => fetcher("/tv/top_rated", { page: p }),
      nowPlaying: (p = 1) => fetcher("/movie/now_playing", { page: p }),
      byGenre: (m, g, p = 1) => fetcher(`/discover/${m}`, { with_genres: g, page: p, sort_by: "popularity.desc" }),
      movieDetails: (id) => fetcher(`/movie/${id}`, { append_to_response: "credits,similar" }),
      tvDetails: (id) => fetcher(`/tv/${id}`, { append_to_response: "credits,similar" }),
      tvSeason: (id, s) => fetcher(`/tv/${id}/season/${s}`),
      search: (q, p = 1) => fetcher("/search/multi", { query: q, page: p, include_adult: false }),
    }),
    [fetcher]
  );
}

/* ---------------- tiny debounce hook ---------------- */
function useDebounce(value, delay = 400) {
  const [d, setD] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setD(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return d;
}

/* ---------------- App state (in-memory, no localStorage) ---------------- */
const DEFAULT_PROFILE = { name: "Bilal", avatarColor: "#0DCAF0", avatarInitial: "B", maturity: "All" };
const COLORS = ["#0DCAF0", "#FF2E92", "#F5A623", "#5CE65C", "#8B7EFF", "#FF5C5C"];
const VIDKING_BASE = "https://www.vidking.net/embed";
const ACCENT = "0dcaf0";

/* ---------------- localStorage persistence ---------------- */
const LS_KEYS = {
  myList: "bilalflix_my_list",
  continueWatching: "bilalflix_continue_watching",
  profile: "bilalflix_profile",
};
function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveLS(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    // storage unavailable (private browsing, quota, etc.) — fail silently
  }
}

// Your TMDB API key, baked in so there's no key-entry screen.
const TMDB_API_KEY = "6bbd4b31154a8c6612db64f5d2c6b924";

function BilalFlix() {
  const [route, setRoute] = useState({ name: "home" });
  const [myList, setMyList] = useState(() => loadLS(LS_KEYS.myList, []));
  const [continueWatching, setContinueWatching] = useState(() => loadLS(LS_KEYS.continueWatching, []));
  const [profile, setProfile] = useState(() => loadLS(LS_KEYS.profile, DEFAULT_PROFILE));
  const tmdb = useTmdb(TMDB_API_KEY);

  useEffect(() => saveLS(LS_KEYS.myList, myList), [myList]);
  useEffect(() => saveLS(LS_KEYS.continueWatching, continueWatching), [continueWatching]);
  useEffect(() => saveLS(LS_KEYS.profile, profile), [profile]);

  const nav = (r) => {
    setRoute(r);
    window.scrollTo?.({ top: 0 });
  };

  const isInMyList = (id, mediaType) => myList.some((i) => i.id === id && i.mediaType === mediaType);
  const toggleMyList = (item) => {
    setMyList((prev) => {
      const exists = prev.some((i) => i.id === item.id && i.mediaType === item.mediaType);
      if (exists) return prev.filter((i) => !(i.id === item.id && i.mediaType === item.mediaType));
      return [{ ...item, addedAt: Date.now() }, ...prev];
    });
  };
  const updateProgress = (entry) => {
    setContinueWatching((prev) => {
      const filtered = prev.filter((i) => !(i.id === entry.id && i.mediaType === entry.mediaType));
      if (entry.progress >= 0.95) return filtered;
      return [{ ...entry, updatedAt: Date.now() }, ...filtered].slice(0, 24);
    });
  };
  const removeFromContinueWatching = (id, mediaType) =>
    setContinueWatching((prev) => prev.filter((i) => !(i.id === id && i.mediaType === mediaType)));

  const clearMyList = () => setMyList([]);
  const clearContinueWatching = () => setContinueWatching([]);
  const ctx = {
    tmdb,
    myList,
    isInMyList,
    toggleMyList,
    continueWatching,
    updateProgress,
    removeFromContinueWatching,
    profile,
    setProfile,
    nav,
    route,
    clearMyList,
    clearContinueWatching,
  };

  return (
    <div className="min-h-screen bg-void text-bone font-sans antialiased" style={rootStyles}>
      <GlobalStyle />
      <Navbar ctx={ctx} />
      <main key={route.name + (route.id || "")} className="animate-fadeIn">
        {route.name === "home" && <Home ctx={ctx} />}
        {route.name === "search" && <SearchPage ctx={ctx} />}
        {route.name === "details" && <Details ctx={ctx} />}
        {route.name === "watch" && <Watch ctx={ctx} />}
        {route.name === "mylist" && <MyListPage ctx={ctx} />}
        {route.name === "continue" && <ContinueWatchingPage ctx={ctx} />}
        {route.name === "profile" && <ProfilePage ctx={ctx} />}
        {route.name === "settings" && <SettingsPage ctx={ctx} />}
      </main>
    </div>
  );
}

/* ---------------- Navbar ---------------- */
function Navbar({ ctx }) {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const links = [
    { r: { name: "home" }, label: "Home" },
    { r: { name: "mylist" }, label: "My List" },
    { r: { name: "continue" }, label: "Continue Watching" },
  ];
  return (
    <header
      className="fixed top-0 left-0 right-0 z-50 transition-colors duration-300"
      style={{
        background: scrolled ? "rgba(11,12,16,0.95)" : "linear-gradient(180deg, rgba(11,12,16,0.8), transparent)",
        borderBottom: scrolled ? "1px solid rgba(255,255,255,0.05)" : "none",
        backdropFilter: scrolled ? "blur(6px)" : "none",
      }}
    >
      <div className="max-w-[1600px] mx-auto px-4 md:px-10 h-16 flex items-center justify-between gap-4">
        <div className="flex items-center gap-8">
          <button onClick={() => ctx.nav({ name: "home" })} className="font-display text-2xl md:text-3xl">
            BILAL<span className="text-cyan-signal">FLIX</span>
          </button>
          <nav className="hidden md:flex items-center gap-6">
            {links.map((l) => (
              <button
                key={l.label}
                onClick={() => ctx.nav(l.r)}
                className="text-sm font-medium transition-colors"
                style={{ color: ctx.route.name === l.r.name ? "#EDEBE4" : "rgba(237,235,228,0.6)" }}
              >
                {l.label}
              </button>
            ))}
          </nav>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={() => ctx.nav({ name: "search" })} className="icon-btn" aria-label="Search" style={iconBtnStyle}>
            <Search size={16} />
          </button>
          <button
            onClick={() => ctx.nav({ name: "profile" })}
            className="w-8 h-8 rounded-md flex items-center justify-center font-bold text-void text-sm shrink-0"
            style={{ backgroundColor: ctx.profile.avatarColor }}
            aria-label="Profile"
          >
            {ctx.profile.avatarInitial}
          </button>
          <button className="md:hidden icon-btn" style={iconBtnStyle} onClick={() => setMobileOpen((v) => !v)} aria-label="Menu">
            {mobileOpen ? <X size={16} /> : <Menu size={16} />}
          </button>
        </div>
      </div>
      {mobileOpen && (
        <nav className="md:hidden bg-void border-t border-white/5 px-4 py-3 flex flex-col gap-3">
          {links.map((l) => (
            <button
              key={l.label}
              onClick={() => {
                ctx.nav(l.r);
                setMobileOpen(false);
              }}
              className="text-sm font-medium py-1 text-left"
              style={{ color: ctx.route.name === l.r.name ? "#0DCAF0" : "rgba(237,235,228,0.7)" }}
            >
              {l.label}
            </button>
          ))}
          <button
            onClick={() => {
              ctx.nav({ name: "settings" });
              setMobileOpen(false);
            }}
            className="text-sm font-medium py-1 text-left text-bone/70"
          >
            Settings
          </button>
        </nav>
      )}
    </header>
  );
}
const iconBtnStyle = {
  width: 36,
  height: 36,
  borderRadius: "9999px",
  border: "1px solid rgba(237,235,228,0.3)",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
};

/* ---------------- Poster card ---------------- */
function PosterCard({ item, ctx, progress }) {
  const mediaType = item.media_type || item.mediaType || (item.first_air_date ? "tv" : "movie");
  const title = item.title || item.name;
  const year = (item.release_date || item.first_air_date || "").slice(0, 4);
  const poster = IMG.poster(item.poster_path || item.poster);

  return (
    <button
      onClick={() => ctx.nav({ name: "details", mediaType, id: item.id })}
      className="poster-card w-[130px] sm:w-[150px] md:w-[170px] shrink-0 text-left"
      aria-label={`View details for ${title}`}
    >
      <div className="bg-slate-850 overflow-hidden" style={{ aspectRatio: "2/3", width: "100%" }}>
        {poster ? (
          <img src={poster} alt={title} loading="lazy" className="w-full h-full object-cover" />
        ) : (
          <div className="w-full h-full flex items-center justify-center text-bone/30 text-xs font-mono p-2 text-center">
            {title}
          </div>
        )}
        {typeof progress === "number" && (
          <div className="absolute bottom-0 left-0 right-0 h-1 bg-white/20">
            <div className="h-full bg-cyan-signal" style={{ width: `${Math.min(progress * 100, 100)}%` }} />
          </div>
        )}
        <div
          className="absolute inset-0 flex flex-col justify-end p-2.5"
          style={{ background: "linear-gradient(to top, rgba(11,12,16,0.9), transparent 60%)" }}
        >
          <span className="text-xs font-semibold text-bone" style={lineClamp2}>
            {title}
          </span>
          <div className="flex items-center gap-2 mt-1 text-[10px] text-bone/60 font-mono">
            {year && <span>{year}</span>}
            {item.vote_average > 0 && (
              <span className="flex items-center gap-0.5 text-cyan-signal">
                <Star size={10} fill="currentColor" /> {item.vote_average.toFixed(1)}
              </span>
            )}
          </div>
        </div>
      </div>
    </button>
  );
}
const lineClamp2 = { display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" };

/* ---------------- Row ---------------- */
function Row({ title, items, loading, emptyMessage, progressMap, ctx }) {
  const scrollerRef = useRef(null);
  const scrollBy = (dir) => {
    const el = scrollerRef.current;
    if (!el) return;
    el.scrollBy({ left: dir * el.clientWidth * 0.8, behavior: "smooth" });
  };

  if (!loading && (!items || items.length === 0)) {
    if (!emptyMessage) return null;
    return (
      <section className="px-4 md:px-10 mb-8">
        <h2 className="text-lg md:text-xl font-display text-bone mb-3">{title}</h2>
        <p className="text-bone/40 text-sm font-mono">{emptyMessage}</p>
      </section>
    );
  }

  return (
    <section className="mb-8 md:mb-10 relative">
      <div className="px-4 md:px-10 flex items-center justify-between mb-3">
        <h2 className="text-lg md:text-xl font-display text-bone">{title}</h2>
        <div className="hidden md:flex gap-2">
          <button onClick={() => scrollBy(-1)} style={iconBtnStyle} aria-label="Scroll left">
            <ChevronLeft size={14} />
          </button>
          <button onClick={() => scrollBy(1)} style={iconBtnStyle} aria-label="Scroll right">
            <ChevronRight size={14} />
          </button>
        </div>
      </div>
      <div ref={scrollerRef} className="row-scroll px-4 md:px-10">
        {loading
          ? Array.from({ length: 8 }).map((_, i) => (
              <div key={i} className="w-[130px] sm:w-[150px] md:w-[170px] shrink-0 rounded-md bg-slate-850 animate-pulse" style={{ aspectRatio: "2/3" }} />
            ))
          : items.map((item) => (
              <PosterCard key={`${item.media_type || item.mediaType || "m"}-${item.id}`} item={item} ctx={ctx} progress={progressMap?.[`${item.id}`]} />
            ))}
      </div>
    </section>
  );
}

      <span className="font-mono text-xs uppercase tracking-[0.3em] text-bone/40">{label}</span>

}
function ErrorNotice({ message }) {

/* ---------------- Hero ---------------- */
function HeroBanner({ item, ctx }) {
  if (!item) return <div className="w-full bg-charcoal animate-pulse" style={{ height: "64vh" }} />;
  const mediaType = item.media_type || (item.first_air_date ? "tv" : "movie");
  const title = item.title || item.name;
  const backdrop = IMG.backdrop(item.backdrop_path, "original");
  const inList = ctx.isInMyList(item.id, mediaType);

  return (
    <div className="relative w-full overflow-hidden" style={{ height: "min(80vh, 640px)", minHeight: 420 }}>

const ACTION = 28, COMEDY = 35, HORROR = 27;
function Home({ ctx }) {
  const [hero, setHero] = useState(null);
  const [rows, setRows] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const [trending, popularMovies, topMovies, popularTV, topTV, nowPlaying, action, comedy, horror] = await Promise.all([
          ctx.tmdb.trending("all", "week"),
          ctx.tmdb.popularMovies(),
          ctx.tmdb.topMovies(),
          ctx.tmdb.popularTV(),
          ctx.tmdb.topTV(),
          ctx.tmdb.nowPlaying(),
          ctx.tmdb.byGenre("movie", ACTION),
          ctx.tmdb.byGenre("movie", COMEDY),
          ctx.tmdb.byGenre("movie", HORROR),
        ]);
        if (cancelled) return;
        const good = trending.results.filter((r) => r.backdrop_path);
        setHero(good[Math.floor(Math.random() * Math.min(5, good.length))]);
        setRows({
          trending: trending.results,
          popularMovies: popularMovies.results,
          topMovies: topMovies.results,
          popularTV: popularTV.results,
          topTV: topTV.results,
          nowPlaying: nowPlaying.results,
          action: action.results,
          comedy: comedy.results,
          horror: horror.results,
        });
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message === "NO_KEY" ? "Missing TMDB API key." : "Couldn't load the catalog. Check your API key and try again.");
          setLoading(false);
        }
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [ctx.tmdb]);

  if (error) return <ErrorNotice message={error} />;

  return (
    <div className="pb-16">

        <Row title="Popular Movies" items={rows.popularMovies} loading={loading} ctx={ctx} />
        <Row title="Popular TV Shows" items={rows.popularTV} loading={loading} ctx={ctx} />
        <Row title="Now Playing" items={rows.nowPlaying} loading={loading} ctx={ctx} />
        <Row title="Top Rated Movies" items={rows.topMovies} loading={loading} ctx={ctx} />
        <Row title="Top Rated TV Shows" items={rows.topTV} loading={loading} ctx={ctx} />
        <Row title="Action & Adventure" items={rows.action} loading={loading} ctx={ctx} />
        <Row title="Comedies" items={rows.comedy} loading={loading} ctx={ctx} />
        <Row title="Horror" items={rows.horror} loading={loading} ctx={ctx} />

/* ---------------- Search ---------------- */
function SearchPage({ ctx }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const debounced = useDebounce(query, 400);

  useEffect(() => {
    if (!debounced.trim()) {
      setResults([]);
      return;
    }
    let cancelled = false;
    setLoading(true);
    ctx.tmdb
      .search(debounced)
      .then((data) => {
        if (cancelled) return;
        setResults(data.results.filter((r) => (r.media_type === "movie" || r.media_type === "tv") && r.poster_path));
        setLoading(false);
      })
      .catch((e) => {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      });
    return () => {
      cancelled = true;
    };
  }, [debounced, ctx.tmdb]);

  return (
    <div className="pt-28 pb-16 px-4 md:px-10 max-w-[1600px] mx-auto min-h-screen">
      <div className="relative max-w-xl mb-10">
        <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-bone/40" size={18} style={{ position: "absolute", left: 16, top: "50%", transform: "translateY(-50%)" }} />
        <input
          autoFocus
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="Search movies and TV shows..."
          className="w-full bg-charcoal border border-white/10 rounded-md py-3 text-bone"
          style={{ paddingLeft: 44, paddingRight: 40, border: "1px solid rgba(255,255,255,0.1)" }}
        />
      </div>
      {error && <ErrorNotice message={error} />}
      {!error && loading && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4">
          {Array.from({ length: 12 }).map((_, i) => (
            <div key={i} className="rounded-md bg-slate-850 animate-pulse" style={{ aspectRatio: "2/3" }} />
          ))}
        </div>
      )}
      {!error && !loading && debounced && results.length === 0 && (
        <p className="text-bone/40 font-mono text-sm">No results for &ldquo;{debounced}&rdquo;.</p>
      )}
      {!error && !loading && results.length > 0 && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4">
          {results.map((item) => (
            <PosterCard key={`${item.media_type}-${item.id}`} item={item} ctx={ctx} />
          ))}
        </div>
      )}
      {!query && <div className="text-bone/30 font-mono text-sm">Start typing to search BilalFlix's catalog.</div>}
    </div>
  );
}

/* ---------------- Watch ---------------- */
function Watch({ ctx }) {
  const { mediaType, id, season, episode } = ctx.route;
  const isTV = mediaType === "tv";
  const seasonNum = Number(season) || 1;
  const episodeNum = Number(episode) || 1;
  const [data, setData] = useState(null);
  const [seasonData, setSeasonData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const lastSaved = useRef(0);

  useEffect(() => {
    setLoading(true);
    window.scrollTo?.({ top: 0 });
    const fetcher = isTV ? ctx.tmdb.tvDetails : ctx.tmdb.movieDetails;
    fetcher(id)
      .then((res) => {
        setData(res);
        setLoading(false);
      })
      .catch((e) => {
        setError("Couldn't load this title.");
        setLoading(false);
      });
  }, [mediaType, id]);

  useEffect(() => {
    if (!isTV) return;
    ctx.tmdb.tvSeason(id, seasonNum).then(setSeasonData).catch(() => {});
  }, [isTV, id, seasonNum]);

  useEffect(() => {
    function handleMessage(event) {
      if (!event.data) return;
      let payload;
      try {
        payload = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
      } catch {
        return;
      }
      if (payload?.type !== "PLAYER_EVENT" || !payload.data) return;
      const d = payload.data;
      const now = Date.now();
      if (d.event === "timeupdate" && now - lastSaved.current < 4000) return;
      lastSaved.current = now;
      if (!data) return;
      ctx.updateProgress({
        id: Number(id),
        mediaType,
        title: data.title || data.name,
        poster: data.poster_path,
        backdrop: data.backdrop_path,
        progress: d.progress ? d.progress / 100 : d.duration ? d.currentTime / d.duration : 0,
        currentTime: d.currentTime,
        duration: d.duration,
        season: isTV ? seasonNum : undefined,
        episode: isTV ? episodeNum : undefined,
      });
    }
    window.addEventListener("message", handleMessage);
    return () => window.removeEventListener("message", handleMessage);
  }, [data, id, mediaType, isTV, seasonNum, episodeNum]);

  const embedUrl = useMemo(() => {
    if (isTV) return `${VIDKING_BASE}/tv/${id}/${seasonNum}/${episodeNum}?color=${ACCENT}&autoPlay=true&nextEpisode=true&episodeSelector=true`;
    return `${VIDKING_BASE}/movie/${id}?color=${ACCENT}&autoPlay=true`;
  }, [isTV, id, seasonNum, episodeNum]);

  if (error) return <ErrorNotice message={error} />;
  if (loading || !data) return <LoadingScreen label="Preparing playback" />;

  const title = data.title || data.name;
  const episodes = seasonData?.episodes || [];
  const idx = episodes.findIndex((e) => e.episode_number === episodeNum);
  const prevEp = idx > 0 ? episodes[idx - 1] : null;
  const nextEp = idx >= 0 && idx < episodes.length - 1 ? episodes[idx + 1] : null;
  const currentEp = episodes[idx];

  return (
    <div className="pt-16 pb-16 bg-void min-h-screen">
      <div className="max-w-[1600px] mx-auto px-4 md:px-10 py-4 flex items-center justify-between">
        <button onClick={() => ctx.nav({ name: "details", mediaType, id })} className="flex items-center gap-2 text-bone/60 text-sm font-medium">
          <ArrowLeft size={16} /> Back to details
        </button>
        {isTV && (
          <div className="flex items-center gap-2">
            <button
              disabled={!prevEp}
              onClick={() => ctx.nav({ name: "watch", mediaType: "tv", id, season: seasonNum, episode: prevEp.episode_number })}
              style={{ ...iconBtnStyle, opacity: prevEp ? 1 : 0.2 }}
              aria-label="Previous episode"
            >
              <ChevronLeft size={16} />
            </button>
            <button
              disabled={!nextEp}
              onClick={() => ctx.nav({ name: "watch", mediaType: "tv", id, season: seasonNum, episode: nextEp.episode_number })}
              style={{ ...iconBtnStyle, opacity: nextEp ? 1 : 0.2 }}
              aria-label="Next episode"
            >
              <ChevronRight size={16} />
            </button>
          </div>
        )}
      </div>
      <div className="max-w-[1600px] mx-auto px-4 md:px-10">
        <div className="w-full bg-black rounded-md overflow-hidden shadow-2xl" style={{ aspectRatio: "16/9" }}>
          <iframe key={embedUrl} src={embedUrl} width="100%" height="100%" frameBorder="0" allowFullScreen title={`${title} player`} className="w-full h-full" />
        </div>
        <div className="mt-6">
          <h1 className="font-display text-2xl md:text-4xl text-bone">{title}</h1>
          {isTV && currentEp && (
            <p className="text-bone/60 font-mono text-sm mt-1">
              S{seasonNum} · E{episodeNum} — {currentEp.name}
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

                  </button>
                  <div className="absolute bottom-0 left-0 right-0 h-1 bg-white/20">
                    <div className="h-full bg-cyan-signal" style={{ width: `${Math.min((item.progress || 0) * 100, 100)}%` }} />
                  </div>
                </div>
                <div className="p-3">
                  <p className="font-semibold text-bone truncate">{item.title}</p>
                  <div className="flex items-center justify-between mt-1">
                    <span className="text-xs text-bone/50 font-mono">
                      {item.mediaType === "tv" && item.season ? `S${item.season} · E${item.episode}` : "Movie"}
                    </span>
                    <span className="text-xs text-bone/50 font-mono">{formatTime(item.currentTime)} left</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------- Profile ---------------- */
function ProfilePage({ ctx }) {
  const [name, setName] = useState(ctx.profile.name);
  const [saved, setSaved] = useState(false);
  const handleSave = () => {
    ctx.setProfile((p) => ({ ...p, name: name.trim() || "Viewer", avatarInitial: (name.trim() || "V")[0].toUpperCase() }));
    setSaved(true);
    setTimeout(() => setSaved(false), 1600);
  };
  return (
    <div className="pt-28 pb-16 px-4 md:px-10 max-w-3xl mx-auto min-h-screen">
      <h1 className="font-display text-3xl md:text-5xl text-bone mb-8">Profile</h1>
      <div className="flex items-center gap-5 mb-10">
        <div className="rounded-lg flex items-center justify-center font-display text-3xl text-void" style={{ width: 80, height: 80, backgroundColor: ctx.profile.avatarColor }}>
          {ctx.profile.avatarInitial}
        </div>
        <div>
          <p className="text-xl font-semibold text-bone">{ctx.profile.name}</p>
          <p className="text-bone/40 text-sm font-mono">
            {ctx.myList.length} saved · {ctx.continueWatching.length} in progress
          </p>
        </div>
      </div>
      <div className="space-y-8">
        <div>
          <label className="block text-sm font-medium text-bone/70 mb-2">Display name</label>
          <input
            value={name}
            onChange={(e) => setName(e.target.value)}
            className="bg-charcoal rounded-md px-4 py-2.5 text-bone"
            style={{ border: "1px solid rgba(255,255,255,0.1)", maxWidth: 320, width: "100%" }}
          />
        </div>
        <div>
          <label className="block text-sm font-medium text-bone/70 mb-3">Avatar color</label>
          <div className="flex gap-3">
            {COLORS.map((c) => (
              <button
                key={c}
                onClick={() => ctx.setProfile((p) => ({ ...p, avatarColor: c }))}
                className="rounded-full flex items-center justify-center"
                style={{ width: 36, height: 36, backgroundColor: c }}
                aria-label={`Choose ${c}`}
              >
                {ctx.profile.avatarColor === c && <Check size={16} className="text-void" />}
              </button>
            ))}
          </div>
        </div>
        <button onClick={handleSave} style={btnPrimary}>
          {saved ? "Saved" : "Save changes"}
        </button>
      </div>
    </div>
  );
}

/* ---------------- Settings ---------------- */
const MATURITY = ["All", "Teen", "Mature"];
function SettingsPage({ ctx }) {
  const [clearedList, setClearedList] = useState(false);
  const [clearedProgress, setClearedProgress] = useState(false);
  return (
    <div className="pt-28 pb-16 px-4 md:px-10 max-w-2xl mx-auto min-h-screen">
      <h1 className="font-display text-3xl md:text-5xl text-bone mb-8">Settings</h1>
      <div className="space-y-10">
        <section>
          <h2 className="text-sm font-semibold text-bone/70 uppercase tracking-wide mb-3">Maturity rating</h2>
          <div className="flex gap-2">
            {MATURITY.map((opt) => (
              <button
                key={opt}
                onClick={() => ctx.setProfile((p) => ({ ...p, maturity: opt }))}
                className="px-4 py-2 rounded-md text-sm font-medium"
                style={{
                  border: "1px solid",
                  borderColor: ctx.profile.maturity === opt ? "#0DCAF0" : "rgba(255,255,255,0.1)",
                  background: ctx.profile.maturity === opt ? "#0DCAF0" : "transparent",
                  color: ctx.profile.maturity === opt ? "#0B0C10" : "rgba(237,235,228,0.6)",
                }}
              >
                {opt}
              </button>
            ))}
          </div>
        </section>
        <section>
          <h2 className="text-sm font-semibold text-bone/70 uppercase tracking-wide mb-3">Data</h2>
          <div className="flex flex-col gap-3">
            <button
              onClick={() => {
                ctx.clearMyList();
                setClearedList(true);
                setTimeout(() => setClearedList(false), 1500);
              }}
              className="flex items-center justify-between bg-charcoal rounded-md px-4 py-3 text-left"
            >
              <span className="text-bone text-sm">Clear My List</span>
              <span className="text-bone/40 text-xs font-mono">{clearedList ? "Cleared" : <Trash2 size={14} />}</span>
            </button>
            <button
              onClick={() => {
                ctx.clearContinueWatching();
                setClearedProgress(true);
                setTimeout(() => setClearedProgress(false), 1500);
              }}
              className="flex items-center justify-between bg-charcoal rounded-md px-4 py-3 text-left"
            >
              <span className="text-bone text-sm">Clear Continue Watching</span>
              <span className="text-bone/40 text-xs font-mono">{clearedProgress ? "Cleared" : <Trash2 size={14} />}</span>
            </button>
          </div>
          <p className="text-bone/30 text-xs font-mono mt-2">
            My List, Continue Watching, and your profile are saved in this browser only.
          </p>
        </section>
        <section>
          <h2 className="text-sm font-semibold text-bone/70 uppercase tracking-wide mb-3">About</h2>
          <p className="text-bone/50 text-sm" style={{ lineHeight: 1.6 }}>
            BilalFlix uses TMDB for catalog metadata and Vidking for video playback. This product
            uses the TMDB API but is not endorsed or certified by TMDB.
          </p>
        </section>
      </div>
    </div>
  );
}
